# Note: AdminService supports Python 2.4 but "py24" is not listed in envlist
# because tox has a dependency on distribute, which no longer supports 2.4.

[tox]
envlist =
    cover,py36

[testenv]
commands =
    python3 setup.py test -q
deps =
    mock >= 0.5.0
    meld3 >= 0.6.5

[testenv:cover]
basepython =
    python3.6
commands =
    python3 setup.py nosetests --with-xunit --with-xcoverage --cover-package=adminservice --cover-erase
deps =
    mock >= 0.5.0
    meld3 >= 0.6.5
    nose
    coverage
    nosexcover
